name: Norma
options:
  bundleIdPrefix: com.norma
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  NormaKit:
    path: ../NormaKit
  NormaProtocol:
    path: ../NormaProtocol
targets:
  Norma:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Support/AppIcon.icns
      - path: HelperShared
    dependencies:
      - package: NormaKit
      - package: NormaProtocol
      - target: NormaHelper
        embed: false
    postCompileScripts:
      - name: Embed NormaHelper
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          DEST_MACOS="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/MacOS"
          DEST_LAUNCHD="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          mkdir -p "${DEST_MACOS}" "${DEST_LAUNCHD}"
          cp "${BUILT_PRODUCTS_DIR}/NormaHelper" "${DEST_MACOS}/NormaHelper"
          cp "${SRCROOT}/HelperResources/com.norma.helper.plist" "${DEST_LAUNCHD}/com.norma.helper.plist"
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: Norma
        CFBundleDisplayName: Norma
        CFBundleIdentifier: com.norma.app
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSPrincipalClass: NSApplication
    entitlements:
      path: Support/Norma.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 37N77U9RSZ
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_OBJC_BRIDGING_HEADER: Support/NormaBridge.h
  NormaAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/NormaAppTests
      - path: HelperSources/SMCController.swift
    dependencies:
      - target: Norma
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Norma.app/Contents/MacOS/Norma"
        BUNDLE_LOADER: "$(TEST_HOST)"
  NormaHelper:
    type: tool
    platform: macOS
    sources:
      - path: HelperSources
      - path: HelperShared
    settings:
      base:
        PRODUCT_NAME: NormaHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.norma.helper
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 37N77U9RSZ
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
schemes:
  Norma:
    build:
      targets:
        Norma: all
        NormaHelper: all
        NormaAppTests: [test]
    test:
      targets: [NormaAppTests]
